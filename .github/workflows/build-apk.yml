
name: Build ULTRON APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew
        if: ${{ hashFiles('gradlew') != '' }}

      - name: Build debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "gradlew.bat" ]; then
            echo "Only the Windows Gradle wrapper was found. Add a Linux gradlew wrapper to build on GitHub Actions."
            exit 1
          else
            echo "Gradle wrapper not found. Add gradlew and the gradle/wrapper files to the repository."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
